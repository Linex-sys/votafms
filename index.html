 <div class="row" style="gap:8px;align-items:flex-start"><div style="flex:1;min-width:0"><label class="f">MC 1</label><input placeholder="MC 1" value="${esc(S.na)}" oninput="S.na=this.value"></div><div style="flex:1;min-width:0"><label class="f">MC 2</label><input placeholder="MC 2" value="${esc(S.nb)}" oninput="S.nb=this.value"></div></div>

function startBat(ci,bi){const e=CAL[ci];const b=batOf(e,e.b[bi]);start({a:b.a,b:b.b,j:b.j,y:b.y||null})}
function ytGo(){const m=(S.yt||'').match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);if(!m){S.err='Ese link no parece de YouTube. Prueba con otro.';return R()}S.err='';start({a:S.na.trim()||'MC 1',b:S.nb.trim()||'MC 2',j:'Batalla por link',y:m[1]})}
function start(b){const l=curL();S.bt=b;S.libre=!!b.libre;S.ri=0;S.rep=null;S.rounds=RF[l.f].slice();S.sc=S.rounds.map(rd=>[Array(sz(rd)).fill(null),Array(sz(rd)).fill(null)]);S.v='vote';R();window.scrollTo(0,0)}
function sumR(k,m){return sum(S.sc[k][m])}
function tot(m){return S.rounds.reduce((a,_,k)=>a+sumR(k,m),0)}
function mainTot(m){return S.rounds.reduce((a,rd,k)=>a+(rd.rep?0:sumR(k,m)),0)}
function counted(m){return S.rep==='voted'?tot(m):mainTot(m)}

function voteV(){
 const b=S.bt,l=curL(),done=S.ri>=S.rounds.length;const [ac1,ac2]=accentOf(l);
 const media=b.y?`<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${b.y}" title="Video de la batalla" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div><a href="https://www.youtube.com/watch?v=${b.y}" target="_blank" rel="noopener" class="btn s" style="text-decoration:none;margin-bottom:14px">${ico('play',18)} Abrir en YouTube</a>`:`<div class="video"><div style="text-align:center">${ico('play',44)}<div class="mu" style="margin-top:8px">Video de la batalla</div></div></div>`;
 return `<div class="lgwrap" style="--ac:${ac1};--ac2:${ac2};--lc:${l.c}"><button class="back" onclick="go('${S.libre?'libre':'lg'}')">${ico('back',18)} ${S.libre?'Batalla libre':esc(l.n)}</button>
 <div class="card"><div class="match"><div class="pl">${av(b.a,'lg')}<span class="n" style="color:var(--ac)">${esc(b.a)}</span></div><span class="vs">VS</span><div class="pl">${av(b.b,'lg')}<span class="n" style="color:var(--b2)">${esc(b.b)}</span></div></div><div class="mu" style="text-align:center;margin-top:10px">${esc(b.j||'')}</div></div>
 ${media}<div id="plan">${done?summaryV():roundV()}</div></div>`;
}
function roundV(){
 const rd=S.rounds[S.ri],n=S.rounds.length;
 const steps=`<div class="steps">${S.rounds.map((r,k)=>`<button class="stp ${k===S.ri?'on':k<S.ri?'done':''}" onclick="goR(${k})">${esc(r.n)}</button>`).join('')}</div>`;
 let off=0;
 const gBase=S.rounds.slice(0,S.ri).reduce((a,r)=>a+r.p.length,0);
 const blocks=rd.p.map((part,pi)=>{const vals=part.c+3,grid=`grid-template-columns:96px repeat(${vals},minmax(34px,1fr)) 46px`;
  const head=`<div class="pgrid" style="${grid}"><span></span>${Array.from({length:part.c},(_,j)=>`<span class="ph">${j+1}</span>`).join('')}<span class="ph">Téc.</span><span class="ph">Flow</span><span class="ph">P.Esc</span><span class="ph">Tot.</span></div>`;
  const order=((gBase+pi)%2===0)?[0,1]:[1,0];
  const rows=order.map(m=>{const ps=sum(S.sc[S.ri][m].slice(off,off+vals));
   return `<div class="pgrid" style="${grid};margin-top:6px"><span class="pname" style="color:${m?'var(--ac2)':'var(--ac)'}">${esc(m?S.bt.b:S.bt.a)}</span>${Array.from({length:vals},(_,j)=>{const idx=off+j,v=S.sc[S.ri][m][idx];return `<button class="cell ${j>=part.c?'crit ':''}${v==null?'empty':'set'}${m?' b':''}" onclick="pick(${m},${idx})">${v==null?'–':fmt(v)}</button>`}).join('')}<div class="tot">${fmt(ps)}</div></div>`}).join('');
  off+=vals;
  return `<div class="pblock">${part.t?`<div class="pbt">${esc(part.t)}</div>`:''}${head}${rows}</div>`}).join('');
 return `${steps}
 <div class="score"><span style="color:var(--ac);font-weight:800">${esc(S.bt.a)}</span><b>${fmt(sumR(S.ri,0))} – ${fmt(sumR(S.ri,1))}</b><span style="color:var(--b2);font-weight:800">${esc(S.bt.b)}</span></div>
 <div class="card pl-card"><div class="pl-head"><div><div class="pl-kicker">${rd.rep?'Réplica':`Ronda ${S.ri+1} de ${n}`}</div><div class="pl-title">${esc(rd.n)}</div></div><div class="pl-dots">${S.rounds.map((_,k)=>`<i class="${k===S.ri?'on':k<S.ri?'done':''}"></i>`).join('')}</div></div><div class="pl-scroll">${blocks}</div><div class="pl-foot"><span class="pl-lab">TOTAL</span><div class="pl-tot" style="color:var(--ac)">${fmt(tot(0))}<small>${esc(S.bt.a)}</small></div><div class="pl-tot" style="color:var(--ac2)">${fmt(tot(1))}<small>${esc(S.bt.b)}</small></div></div></div>
 <div class="row" style="gap:8px"><button class="btn s" style="margin:0" onclick="mv(-1)" ${S.ri?'':'disabled'}>Anterior</button><button class="btn" style="margin:0" onclick="mv(1)">${S.ri===n-1?'Ver resultado':'Siguiente'}</button></div>`;
}
function summaryV(){
 const ma=mainTot(0),mb=mainTot(1),md=Math.abs(ma-mb);
 if(!S.rep&&md<1)return repPrompt(ma,mb,md);
 const a=counted(0),b=counted(1),d=Math.abs(a-b);
 const tag=S.rep==='voted'?'Ganador con réplica':S.rep==='skipped'?'Ganador sin réplica':'Ganador directo';
 const w=a===b?'Empate':`${tag}: ${a>b?S.bt.a:S.bt.b}, por ${fmt(d)} punto${d===1?'':'s'}`;
 const rows=S.rounds.map((r,k)=>`<span class="n">${esc(r.n)}</span><span class="c">${fmt(sumR(k,0))}</span><span class="c">${fmt(sumR(k,1))}</span>`).join('');
 return `<div class="win">${w}</div>
 <div class="score"><span style="color:var(--ac);font-weight:800">${esc(S.bt.a)}</span><b>${fmt(a)} – ${fmt(b)}</b><span style="color:var(--b2);font-weight:800">${esc(S.bt.b)}</span></div>
 <div class="card"><div class="tbl"><span></span><span class="h" style="color:var(--ac)">${esc(S.bt.a)}</span><span class="h" style="color:var(--b2)">${esc(S.bt.b)}</span>${rows}<b>Total</b><span class="c">${fmt(a)}</span><span class="c">${fmt(b)}</span></div></div>
 <button class="btn" onclick="saveVote()">Guardar mi voto</button><button class="btn s" onclick="goR(${S.rounds.length-1})">Volver a las rondas</button>`;
}
function repPrompt(ma,mb,md){
 return `<div class="card" style="text-align:center"><div class="mu">Diferencia de ${fmt(md)} punto${md===0?'':'s'}</div><div style="font-weight:900;font-size:19px;margin:6px 0 12px">Hay réplica</div><div class="score" style="margin-bottom:12px"><span style="color:var(--ac);font-weight:800">${esc(S.bt.a)} ${fmt(ma)}</span><span class="mu">vs</span><span style="color:var(--b2);font-weight:800">${fmt(mb)} ${esc(S.bt.b)}</span></div><div class="mu">Una diferencia menor a 1 punto necesita réplica. Puedes votarla o dejarla fuera.</div></div><button class="btn" onclick="votarReplica()">Votar réplica</button><button class="btn s" onclick="omitirReplica()">Omitir réplica</button>`;
}
function votarReplica(){S.rounds.push(REP);S.sc.push([Array(sz(REP)).fill(null),Array(sz(REP)).fill(null)]);S.rep='voted';S.ri=S.rounds.length-1;R();window.scrollTo(0,0)}
function omitirReplica(){S.rep='skipped';R();window.scrollTo(0,0)}
function goR(k){S.ri=k;R();window.scrollTo(0,0)}
function mv(d){S.ri=Math.max(0,Math.min(S.rounds.length,S.ri+d));R();window.scrollTo(0,0)}
function pick(m,idx){const cur=S.sc[S.ri][m][idx];S.sheet={m,idx,str:cur==null?'':fmtKey(cur)};S.kpe='';R()}
function setV(v){const h=S.sheet;S.sc[S.ri][h.m][h.idx]=v;S.sheet=null;S.kpe='';R()}
function closeSheet(){S.sheet=null;S.kpe='';R()}
function kpAdd(d){const h=S.sheet;let c=h.str||'';
 if(d==='10'){h.str='10';S.kpe='';return R()}
 if(d===','){if(c.includes(','))return R();c=(c===''?'0':c)+','}
 else if(c==='0'){c=d}
 else if(c.length>=4){return R()}
 else{c+=d}
 h.str=c;S.kpe='';R()}
function kpDel(){S.sheet.str=(S.sheet.str||'').slice(0,-1);S.kpe='';R()}
function kpClr(){S.sheet.str='';S.kpe='';R()}
function kpOk(){const str=(S.sheet.str||'').trim();if(str===''){return setV(null)}
 const norm=str.replace(',','.'),v=Number(norm);
 if(isNaN(v)||v<0||v>10||norm.endsWith('.')||Math.round(v*2)!==v*2){S.kpe='Usa un número de 0 a 10, con medio punto (por ejemplo 1,5).';return R()}
 setV(v)}
function sheetH(){const h=S.sheet;const vals=[];for(let i=0;i<=20;i++)vals.push(i/2);
 return `<div class="ov" onclick="closeSheet()"><div class="sh" onclick="event.stopPropagation()"><div class="row" style="justify-content:space-between;margin-bottom:14px"><b style="font-size:17px">${esc(h.m?S.bt.b:S.bt.a)}</b><span class="mu">Elige de 0 a 10</span></div><div class="pk">${vals.map(v=>`<button onclick="setV(${v})">${fmt(v)}</button>`).join('')}<button class="clr" onclick="setV(null)">Borrar</button></div></div></div>`}
function buildVote(){const a=counted(0),b=counted(1);
 const rows=S.rounds.map((r,k)=>({r:r.n,ta:sumR(k,0),tb:sumR(k,1),rep:!!r.rep})).filter(r=>S.rep==='voted'||!r.rep);
 return {l:S.lg,a:S.bt.a,b:S.bt.b,ta:a,tb:b,rows,date:today(),free:!!S.libre}}
function summ(rows){let wa=0,wb=0,sa=0,sb=0;rows.forEach(r=>{sa+=r.ta;sb+=r.tb;if(r.ta>r.tb)wa++;else if(r.tb>r.ta)wb++});return {n:rows.length,wa,wb,sa,sb}}
async function saveVote(){const v=buildVote();if(!S.me){S.pend=v;return openAuth('create')}await pushVote(v)}
async function pushVote(v){
 v.uid=S.me.uid;v.u=S.me.u;v.key=ck(v.free?'libre':v.l,v.a,v.b);v.ts=Date.now();
 let c={n:0,wa:0,wb:0};try{c=summ(await B.votesKey(v.key))}catch(e){}
 const cw=c.wa>=c.wb?0:1,uw=v.ta===v.tb?-1:(v.ta>v.tb?0:1);
 v.msg=uw<0?'Empate':c.n===0?'Primer voto de esta batalla':uw===cw?'Coincide con la mayoría':'Votaste distinto a la mayoría';
 try{await B.addVote(v)}catch(e){S.msgP='No se pudo guardar tu voto. Revisa tu conexión.';R();return}
 S.last=v;S.myVotes=null;S.v='res';S.comm=null;R();window.scrollTo(0,0);
 try{S.comm=summ(await B.votesKey(v.key))}catch(e){S.comm={n:0,wa:0,wb:0,sa:0,sb:0}}
 R();
}
function resV(){const v=S.last;if(!v)return homeV();const c=S.comm;const tw=c?c.wa+c.wb:0;const pa=tw?Math.round(c.wa/tw*100):50;
 return `<div class="ok">Voto guardado en tu perfil</div>
 <div class="card"><b>Resultados de la comunidad</b>${c?`<div class="row" style="justify-content:space-between;margin-top:10px"><b style="color:var(--ac)">${esc(v.a)} ${tw?pa:'–'}%</b><b style="color:var(--b2)">${tw?100-pa:'–'}% ${esc(v.b)}</b></div><div class="bar"><i style="width:${pa}%"></i></div><div class="mu">${c.n} ${c.n===1?'voto':'votos'} en esta batalla</div>`:'<div class="mu" style="margin-top:8px">Cargando resultados…</div>'}</div>
 ${c&&c.n?`<div class="stats"><div class="stat"><big>${fmt(Math.round(c.sa/c.n*10)/10)}</big><span>Media de ${esc(v.a)}</span></div><div class="stat"><big>${fmt(Math.round(c.sb/c.n*10)/10)}</big><span>Media de ${esc(v.b)}</span></div></div>`:''}
 <div class="card" style="margin-top:12px"><b>Tu voto</b><div class="mu" style="margin-top:4px">${fmt(v.ta)} – ${fmt(v.tb)} · ${esc(v.msg||'')}</div></div>
 <button class="btn" onclick="go('perfil')">Ver mi perfil</button><button class="btn s" onclick="go('home')">Votar otra batalla</button>`}

 return `<div class="tlc"><span class="dot" style="background:${col}"></span><div class="card" style="margin:0"><div class="row" style="margin-bottom:10px">${l?logo(l,38):''}<div style="flex:1;min-width:0"><b>${esc(e.n)}</b><div class="mu" style="font-size:12px">${esc(e.d||'Fecha por confirmar')}${e.s?' · '+esc(e.s):''}</div></div></div><span class="pill ${e.k==='next'?'next':e.k==='done'?'done':''}">${esc(e.st)}</span>${e.lu&&e.lu.length?`<div class="chips">${e.lu.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`:''}${e.b&&e.b.length?`<div style="margin-top:10px">${e.b.map(x=>crow(batOf(e,x))).join('')}</div>`:''}${e.note?`<div class="mu" style="margin-top:8px;font-size:12px">${esc(e.note)}</div>`:''}</div></div>`}).join('')}</div>`}

function searchV(){return `<h1 class="pg">Buscar usuarios</h1><input placeholder="Buscar por nombre de usuario" value="${esc(S.q)}" oninput="S.q=this.value;document.getElementById('ul').innerHTML=ulist()"><div id="ul">${S.users===null?'<div class="card mu">Cargando usuarios…</div>':ulist()}</div>`}
function ulist(){const list=S.users||[],q=(S.q||'').trim().toLowerCase(),f=list.filter(x=>!q||x.u.toLowerCase().includes(q));
 if(!f.length)return `<div class="card mu">${list.length?'No encontramos ese usuario.':'Todavía no hay usuarios registrados. ¡Sé el primero!'}</div>`;
 return f.map(x=>`<button class="vrow" onclick="openU('${esc(x.uid)}')">${avU(x,'')}<div style="flex:1;min-width:0"><b>${esc(x.u)}</b><div class="mu" style="font-size:12px">Se unió: ${esc(x.joined||'—')}</div></div>${ico('back',18).replace('<svg','<svg style="transform:rotate(180deg);color:var(--mu)"')}</button>`).join('')}
function openU(uid){S.uid=uid;go('user')}
function profileHead(u,isMe){return `<div class="banner" style="--c:#FF4D5E;--c2:#FF9A3D">${avU(u,'lg')}<div style="flex:1;min-width:0"><span class="kicker">${isMe?'Tu perfil':'Usuario'}</span><h1>${esc(u.u)}</h1><p>${esc(u.p||'Sin país')} · ${u.m?'MC favorito: '+esc(u.m):'Sin MC favorito'}</p></div></div>${u.a?`<div class="card"><div class="mu" style="margin-bottom:4px">Sobre mí</div>${esc(u.a)}</div>`:''}<div class="mu" style="margin:-4px 2px 14px">Se unió: ${esc(u.joined||'—')}</div>`}
function statsCard(votes){const n=votes.length,by=L.map(l=>({l,c:votes.filter(v=>v.l===l.i).length})).filter(o=>o.c),C=2*Math.PI*44;let off=0;
 const ring=by.map(o=>{const len=o.c/n*C,s=`<circle r="44" cx="60" cy="60" fill="none" stroke="${colr(o.l)}" stroke-width="14" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=len;return s}).join('');
 return `<div class="card"><div class="stats" style="margin-bottom:14px"><div class="stat"><big>${n}</big><span>Batallas votadas</span></div><div class="stat"><big>${by.length}</big><span>Ligas votadas</span></div></div>${n?`<div class="row"><svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Votos por liga"><circle r="44" cx="60" cy="60" fill="none" stroke="var(--bd)" stroke-width="14"/>${ring}<text x="60" y="67" text-anchor="middle" font-size="22" font-weight="900" fill="var(--tx)">${n}</text></svg><div style="flex:1;min-width:0">${by.map(o=>`<div style="font-size:13px;margin:5px 0"><span style="color:${colr(o.l)};font-size:16px">●</span> ${esc(o.l.n)} <span class="mu">· ${o.c}</span></div>`).join('')}</div></div>`:'<div class="mu">Sin votos todavía.</div>'}</div>`}
function voteList(list,from){if(list===null)return '<div class="card mu">Cargando votos…</div>';
 return list.length?list.map((v,i)=>{const l=L.find(x=>x.i===v.l);return `<button class="vrow" onclick="viewVote(${i},'${from}')">${l?logo(l,34):''}<div style="flex:1;min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(v.a)} vs ${esc(v.b)}</b><div class="mu" style="font-size:12px">${v.free?'Batalla libre · ':''}${esc(l?l.n:'')} · ${esc(v.date||'')}</div></div><b>${fmt(v.ta)} – ${fmt(v.tb)}</b></button>`}).join(''):'<div class="card mu">Sin votos todavía.</div>'}
function viewVote(i,from){S.viewList=from==='perfil'?(S.myVotes||[]):(S.uVotes||[]);S.vi=i;S.vb=from;go('vd')}

 <label class="f">País</label><input id="pf-p" value="${esc(m.p||'')}">
 <label class="f">MC favorito</label><input id="pf-m" value="${esc(m.m||'')}">
 <label class="f">Sobre mí</label><textarea id="pf-a" rows="3">${esc(m.a||'')}</textarea>
 <button class="btn sm" style="width:100%;justify-content:center" onclick="saveProf()">Guardar cambios</button></div>
 ${statsCard(S.myVotes||[])}<div class="sec"><span>Mis votos</span><span>${S.myVotes?S.myVotes.length:'…'}</span></div>${voteList(S.myVotes,'perfil')}

async function saveProf(){const m=S.me;if(!m)return;const prof={p:document.getElementById('pf-p').value.trim(),m:document.getElementById('pf-m').value.trim(),a:document.getElementById('pf-a').value.trim()};
 try{await B.updateUser(m.uid,prof);S.me={...S.me,...prof};S.msgP='Cambios guardados'}catch(e){S.msgP='No se pudieron guardar los cambios.'}R()}
async function logout(){try{await FB.am.signOut(FB.auth)}catch(e){}S.me=null;S.myVotes=null;S.msgP='';go('home')}

function openAuth(mode){S.auth={mode,step:'mail',email:'',un:'',pw:'',pw2:'',err:'',busy:false};R()}
function closeAuth(){const googleStep=S.auth&&S.auth.mode==='google';S.auth=null;S.pend=null;if(googleStep&&FB&&FB.auth.currentUser){FB.am.signOut(FB.auth)}R()}
function authTab(m){S.auth.mode=m;S.auth.err='';R()}
function authErr(msg){if(S.auth){S.auth.err=msg;S.auth.busy=false}R()}
function fbErr(e){const m={'auth/invalid-credential':'Correo o contraseña incorrectos.','auth/wrong-password':'Contraseña incorrecta.','auth/user-not-found':'No hay una cuenta con ese correo.','auth/invalid-email':'El correo no es válido.','auth/email-already-in-use':'Ya existe una cuenta con ese correo.','auth/weak-password':'La contraseña es muy corta (mínimo 6).','auth/popup-closed-by-user':'Cerraste la ventana de Google antes de terminar.','auth/popup-blocked':'Tu navegador bloqueó la ventana de Google. Permite ventanas emergentes e intenta de nuevo.','auth/too-many-requests':'Demasiados intentos. Espera un momento.','auth/network-request-failed':'Sin conexión. Revisa tu internet.'};return m[(e&&e.code)||'']||'Algo salió mal. Intenta de nuevo.'}
function gBadge(){return '<span class="gbadge">G</span>'}
function ovWrap(inner,close){return `<div class="ov" onclick="${close}"><div class="sh" onclick="event.stopPropagation()">${inner}</div></div>`}
function authM(){const A=S.auth;
 if(A.mode==='google')return ovWrap(`<b style="font-size:19px">Elige tu nombre de usuario</b><div class="mu" style="margin:4px 0 14px">Así te verán los demás. Usa de 3 a 20 letras, números, punto o guion bajo.</div><label class="f">Nombre de usuario</label><input placeholder="tu_nombre" value="${esc(A.un)}" oninput="S.auth.un=this.value" onkeydown="if(event.key==='Enter')submitUsername()">${A.err?`<div class="err">${esc(A.err)}</div>`:''}<button class="btn" onclick="submitUsername()" ${A.busy?'disabled':''}>${A.busy?'Un momento…':'Guardar y entrar'}</button>`,'closeAuth()');
 const c=A.mode==='create';
 return ovWrap(`<div class="seg"><button class="${c?'on':''}" onclick="authTab('create')">Crear cuenta</button><button class="${!c?'on':''}" onclick="authTab('in')">Iniciar sesión</button></div>
 <b style="font-size:19px">${c?'Crea tu cuenta':'Bienvenido de nuevo'}</b>
 <div class="mu" style="margin:4px 0 14px">${c?'Con Google o con correo y contraseña.':'Entra con Google o con tu correo y contraseña.'}</div>
 <button class="btn s" onclick="googleLogin()" ${A.busy?'disabled':''}>${gBadge()} Continuar con Google</button>
 <div class="or">o con correo</div>
 <label class="f">Correo</label><input type="email" autocomplete="email" placeholder="tu@correo.com" value="${esc(A.email)}" oninput="S.auth.email=this.value">
 ${c?`<label class="f">Nombre de usuario</label><input placeholder="tu_nombre" autocomplete="username" value="${esc(A.un)}" oninput="S.auth.un=this.value">`:''}
 <label class="f">Contraseña</label><input type="password" autocomplete="${c?'new-password':'current-password'}" placeholder="Mínimo 6 caracteres" value="${esc(A.pw)}" oninput="S.auth.pw=this.value" onkeydown="if(event.key==='Enter')authSubmit()">
 ${c?`<label class="f">Repite la contraseña</label><input type="password" autocomplete="new-password" placeholder="Repite la contraseña" value="${esc(A.pw2)}" oninput="S.auth.pw2=this.value" onkeydown="if(event.key==='Enter')authSubmit()">`:''}
 ${A.err?`<div class="err">${esc(A.err)}</div>`:''}
 <button class="btn" onclick="authSubmit()" ${A.busy?'disabled':''}>${A.busy?'Un momento…':c?'Crear cuenta':'Entrar'}</button>`,'closeAuth()');
}
async function googleLogin(){if(S.auth){S.auth.busy=true}S.authBusy=true;R();
 try{const cred=await FB.am.signInWithPopup(FB.auth,new FB.am.GoogleAuthProvider());const prof=await B.getUser(cred.user.uid);S.authBusy=false;
  if(prof){setMe(cred.user.uid,prof)}else{S.auth={mode:'google',step:'user',un:'',err:'',busy:false};R()}
 }catch(e){S.authBusy=false;authErr(fbErr(e))}}
async function submitUsername(){const A=S.auth;const un=(A.un||'').trim().toLowerCase();
 if(!/^[a-z0-9._]{3,20}$/.test(un))return authErr('Usa de 3 a 20 letras, números, punto o guion bajo.');
 A.busy=true;R();S.authBusy=true;
 try{const uid=FB.auth.currentUser.uid;
  if(await B.usernameTaken(un)){S.authBusy=false;return authErr('Ese nombre de usuario ya está en uso.')}
  const prof={p:'',m:'',a:'',joined:today()};await B.createUser(uid,un,prof);S.authBusy=false;setMe(uid,{u:un,...prof});
 }catch(e){S.authBusy=false;authErr(fbErr(e))}}
async function authSubmit(){const A=S.auth;if(!A||A.busy)return;
 const email=(A.email||'').trim().toLowerCase(),pw=A.pw||'';
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return authErr('Escribe un correo válido.');
 if(A.mode==='create'){
  const un=(A.un||'').trim().toLowerCase();
  if(!/^[a-z0-9._]{3,20}$/.test(un))return authErr('El usuario debe tener de 3 a 20 letras, números, punto o guion bajo.');
  if(pw.length<6)return authErr('La contraseña debe tener al menos 6 caracteres.');
  if(pw!==A.pw2)return authErr('Las contraseñas no coinciden.');
  A.busy=true;S.authBusy=true;R();
  try{
   if(await B.usernameTaken(un)){S.authBusy=false;return authErr('Ese nombre de usuario ya está en uso.')}
   const cred=await FB.am.createUserWithEmailAndPassword(FB.auth,email,pw);
   const prof={p:'',m:'',a:'',joined:today()};
   await B.createUser(cred.user.uid,un,prof);
   S.authBusy=false;setMe(cred.user.uid,{u:un,...prof});
  }catch(e){S.authBusy=false;authErr(fbErr(e))}
 }else{
  A.busy=true;S.authBusy=true;R();
  try{
   const cred=await FB.am.signInWithEmailAndPassword(FB.auth,email,pw);
   const prof=await B.getUser(cred.user.uid);S.authBusy=false;
   if(!prof)return authErr('Tu cuenta no tiene perfil de usuario todavía.');
   setMe(cred.user.uid,prof);
  }catch(e){S.authBusy=false;authErr(fbErr(e))}
 }
}

function fbM(){
 if(S.fbs)return `<div class="ov" onclick="closeFb()"><div class="sh" onclick="event.stopPropagation()"><b style="font-size:18px">¡Gracias por tu comentario!</b><div class="mu" style="margin:6px 0 16px">Lo revisaremos para mejorar la app.</div><button class="btn" onclick="S.fbs=false;R()">Enviar otro</button><button class="btn s" onclick="closeFb()">Cerrar</button></div></div>`;
 return `<div class="ov" onclick="closeFb()"><div class="sh" onclick="event.stopPropagation()"><b style="font-size:18px">Envíanos tus comentarios</b><div class="mu" style="margin:6px 0 12px">Ideas, errores o lo que te gustaría ver en la app.</div><textarea rows="5" placeholder="Escribe aquí..." oninput="S.fbt=this.value">${esc(S.fbt||'')}</textarea>${S.fbe?`<div class="err">${esc(S.fbe)}</div>`:''}<button class="btn" onclick="sendFb()">Enviar comentario</button><button class="btn s" onclick="closeFb()">Cancelar</button></div></div>`}
function openFb(){S.fb=true;S.fbs=false;S.fbe='';R()}
function closeFb(){S.fb=false;S.fbs=false;S.fbe='';R()}
async function sendFb(){const t=(S.fbt||'').trim();if(!t){S.fbe='Escribe un comentario antes de enviarlo.';return R()}
 try{await B.addComment({t,d:today(),u:S.me?S.me.u:'anónimo',ts:Date.now()});S.fbt='';S.fbe='';S.fbs=true}catch(e){S.fbe='No se pudo enviar. Intenta de nuevo.'}R()}

async function cambiarFoto(file){if(!file||!S.me)return;
 S.msgP='Guardando foto…';R();
 try{const url=await imagenCuadrada(file,256);await B.updateUser(S.me.uid,{foto:url});S.me={...S.me,foto:url};S.msgP='Foto de perfil actualizada'}
 catch(e){S.msgP='No se pudo cambiar la foto. Prueba con otra imagen.'}
 R();}
function imagenCuadrada(file,size){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);
 img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');const m=Math.min(img.width,img.height);
  x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,size,size);URL.revokeObjectURL(u);
  let q=0.85,d=c.toDataURL('image/jpeg',q);while(d.length>350000&&q>0.4){q-=0.1;d=c.toDataURL('image/jpeg',q)}res(d)};
 img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('imagen'))};img.src=u})}

function lbStart(){const B2=S.lb;const a=B2.a.trim(),b=B2.b.trim();

 B2.err='';S.lg=B2.lg;start({a,b,j:'Batalla libre',y,libre:true})}
